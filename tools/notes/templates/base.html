<!DOCTYPE html>
<html lang="en">
<head>
<!-- Generated by tools/notes/build.py from content/notes/. Do not edit by hand. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}{% endblock %}</title>
<meta name="description" content="{% block description %}{% endblock %}">
{% block robots %}{% endblock %}
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="{% block og_type %}website{% endblock %}">
<meta property="og:site_name" content="BE Human Labs">
<meta property="og:title" content="{% block og_title %}{% endblock %}">
<meta property="og:description" content="{{ self.description() }}">
<meta property="og:image" content="{{ site.site }}/og-image.png">
<meta property="og:url" content="{{ url }}">
<link rel="canonical" href="{{ url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#E7DDD2">
<link rel="preload" href="/fonts/Gloock-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/lab.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">{{ site.symbol|safe }}</svg>

<header class="bar skin">
  <div class="wrap">
    <a class="brand" href="/" aria-label="BE Human Labs, home"><svg viewBox="0 0 744 744" aria-hidden="true"><use href="#bhl-mark" width="744" height="744"/></svg><span>BE HUMAN LABS</span></a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav class="nav" id="nav" aria-label="Sections">
      <a href="/#why">Why</a>
      <a href="/#lab">How we work</a>
      <a href="/notes/"{% if current == "index" %} aria-current="page"{% else %} aria-current="true"{% endif %}>From the lab</a>
      <a href="/#involved">Get involved</a>
      <a href="/be-human-labs-one-pager.pdf" download>Save my card</a>
    </nav>
    <a class="btn" href="/#involved">Talk to us</a>
  </div>
</header>

<main id="top">
{% block main %}{% endblock %}
</main>

<footer class="skin-black foot">
  <div class="wrap">
    <div class="top">
      <a class="brand" href="/"><svg viewBox="0 0 744 744" aria-hidden="true"><use href="#bhl-mark" width="744" height="744"/></svg>BE HUMAN LABS</a>
    </div>
    <small>&#169; 2026 BE Human Labs</small>
  </div>
</footer>

<dialog class="dlg skin" id="dlg" aria-labelledby="dlg-h">
  <div class="dlg-top">
    <h2 id="dlg-h">Talk to us</h2>
    <button class="tlink" type="button" data-close>Close</button>
  </div>
  <p class="dlg-topic" id="dlg-topic">About: <b></b></p>
  <form class="f pform" id="dlg-form" novalidate>
    <div class="pfields" data-bhl-profile="dl"></div>
    <div class="field"><label class="lbl" for="dl-msg">Your message <span class="optional">(optional)</span></label><textarea id="dl-msg"></textarea></div>
    <div data-bhl-keep="dl"></div>
    <input class="hp" type="text" name="company_website" id="dl-cw" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="err" id="dl-err" aria-live="polite" hidden></p>
    <button class="btn" type="submit" id="dl-send">Send</button>
    <div data-bhl-notice></div>
  </form>
  <div class="done" id="dl-done" hidden tabindex="-1">
    <h3></h3>
    <p>We have <b></b>.</p>
    <div class="actions"><button class="btn" type="button" data-close>Close</button></div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script type="application/json" id="page-data">{{ data|safe }}</script>
<script src="/js/forms.js"></script>
<script src="/js/lab.js"></script>
</body>
</html>
