<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- The business card QR: go.behumanlabs.com/connect, sent here by a Cloudflare redirect rule. A real page, so Web Analytics counts each visit to /connect as a card scan.
     Change where the card goes by editing this page, never the card. -->
<meta http-equiv="refresh" content="2;url=/">
<title>BE Human Labs</title><link rel="icon" href="/favicon.svg">
<style>
@font-face{font-family:"Gloock";src:url("/fonts/Gloock-Regular.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Hanken Grotesk";src:url("/fonts/HankenGrotesk.woff2") format("woff2");font-weight:100 900;font-display:swap}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#E7DDD2;color:#000100;font-family:"Hanken Grotesk",system-ui,sans-serif;padding:24px;box-sizing:border-box}
main{max-width:520px} img{width:72px;height:72px}
h1{font-family:"Gloock",Georgia,serif;font-weight:400;font-size:32px;line-height:1.1;margin:24px 0 12px}
a{color:#361E1E;font-weight:600;text-underline-offset:3px}
</style></head>
<body><main><img src="/be-human-labs-mark.svg" alt=""><h1>Taking you to BE Human Labs...</h1><p><a href="/">Go to behumanlabs.com</a></p></main>

// Leave on "load", once the Web Analytics beacon (injected by Cloudflare) has recorded the visit. The meta refresh covers browsers without script.
addEventListener("load", () => location.replace("/"));
</script>
</body></html>
